<!doctype html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#0f1420;font-family:Segoe UI,Arial,sans-serif}</style></head><body>
<svg id="art" width="1400" height="1000" viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Arial,sans-serif">
<rect width="1400" height="1000" fill="#0f1420"/>
<text x="40" y="58" fill="#e8eefc" font-size="38" font-weight="800">Echo Bot · Wiring (ESP32 DevKit)</text>
<text x="40" y="92" fill="#8fa3c8" font-size="20">Everything fits in a 10×10 cm switch box · solder or use female jumpers</text>

<rect x="560" y="220" width="250" height="520" rx="16" fill="#1b1f2a" stroke="#4a5577" stroke-width="3"/>
<rect x="610" y="250" width="150" height="110" rx="6" fill="#c9ced8"/>

<g font-size="17" font-weight="700" fill="#e8eefc">
 <!-- left pins -->
 <g><circle cx="560" cy="420" r="9" fill="#ffd54f"/><text x="575" y="426">3V3</text></g>
 <g><circle cx="560" cy="470" r="9" fill="#222" stroke="#888"/><text x="575" y="476">GND</text></g>

 <!-- right pins -->
 <g><circle cx="810" cy="400" r="9" fill="#7c4dff"/><text x="730" y="406">GPIO 21</text></g>
 <g><circle cx="810" cy="440" r="9" fill="#00bfa5"/><text x="730" y="446">GPIO 22</text></g>
 <g><circle cx="810" cy="500" r="9" fill="#ffab40"/><text x="738" y="506">GPIO 5</text></g>

</g>

<!-- OLED -->
<rect x="965" y="300" width="265" height="150" rx="10" fill="#1565c0"/>
<rect x="1030" y="330" width="180" height="100" rx="4" fill="#02050b"/>
<rect x="1060" y="355" width="40" height="46" rx="10" fill="#7fdcff"/><rect x="1140" y="355" width="40" height="46" rx="10" fill="#7fdcff"/>
<text x="1120" y="290" text-anchor="middle" fill="#e8eefc" font-size="20" font-weight="800">0.96" OLED</text>
<g font-size="14" font-weight="700" fill="#fff"><text x="972" y="350">GND</text><text x="972" y="380">VCC</text><text x="972" y="410">SCL</text><text x="972" y="440">SDA</text></g>
<!-- HC-SR04 -->
<rect x="965" y="490" width="285" height="100" rx="10" fill="#1565c0"/>
<circle cx="1075" cy="540" r="34" fill="#c9d1dd"/><circle cx="1075" cy="540" r="20" fill="#3a404d"/>
<circle cx="1185" cy="540" r="34" fill="#c9d1dd"/><circle cx="1185" cy="540" r="20" fill="#3a404d"/>
<text x="1130" y="620" text-anchor="middle" fill="#e8eefc" font-size="20" font-weight="800">HC-SR04</text>
<g font-size="13" font-weight="700" fill="#fff"><text x="970" y="505">TRIG</text><text x="970" y="545">ECHO</text><text x="970" y="572">VCC</text><text x="970" y="586">GND</text></g>
<!-- 10k on echo -->
<rect x="880" y="530" width="44" height="18" rx="6" fill="#d7c39a"/><text x="902" y="525" text-anchor="middle" fill="#ffd54f" font-size="14">10k</text>
<!-- buzzer -->
<circle cx="1110" cy="700" r="38" fill="#222" stroke="#666" stroke-width="3"/><circle cx="1110" cy="700" r="6" fill="#555"/>
<text x="1170" y="694" fill="#e8eefc" font-size="20" font-weight="800">Buzzer</text><text x="1170" y="718" fill="#8fa3c8" font-size="15">long leg (+) → 25</text>

<!-- wires right -->
<g fill="none" stroke-width="4">
 <path d="M810 400 H900 V435 H965" stroke="#7c4dff"/>
 <path d="M810 440 H880 V405 H965" stroke="#00bfa5"/>
 <path d="M810 500 H965" stroke="#ffab40"/>
 <path d="M810 540 H880 M924 540 H965" stroke="#64dd17"/>
 <path d="M810 600 H1040 V690 H1072" stroke="#ffd740"/>
 <path d="M810 650 H945 V745 H1110 V738" stroke="#888"/>
 <path d="M945 650 V582 H965" stroke="#888"/>
 <path d="M945 582 V345 H965" stroke="#888"/>
</g>
<!-- OLED VCC from 3V3 (left) -->
<path d="M560 420 H520 V170 H950 V375 H965" fill="none" stroke="#ffd54f" stroke-width="4"/>
<text x="700" y="160" fill="#ffd54f" font-size="15" text-anchor="middle">3V3 → OLED VCC</text>

<!-- POWER (left) -->
<rect x="60" y="430" width="170" height="160" rx="12" fill="#253048" stroke="#3a4a6e" stroke-width="2"/>
<rect x="78" y="450" width="134" height="52" rx="18" fill="#3dbb6c"/><rect x="78" y="520" width="134" height="52" rx="18" fill="#3dbb6c"/>
<text x="145" y="482" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">18650</text><text x="145" y="552" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">18650</text>
<text x="145" y="620" text-anchor="middle" fill="#e8eefc" font-size="17" font-weight="800">2 cells PARALLEL</text>
<text x="145" y="642" text-anchor="middle" fill="#8fa3c8" font-size="14">+ to +, − to − (3.7V)</text>

<rect x="270" y="440" width="120" height="90" rx="8" fill="#1565c0"/>
<rect x="300" y="530" width="60" height="16" rx="6" fill="#9aa3b5"/>
<text x="330" y="475" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">TP4056</text>
<text x="330" y="497" text-anchor="middle" fill="#bcd6ff" font-size="13">Type-C charge</text>
<g font-size="13" fill="#e8eefc"><text x="273" y="456">B+</text><text x="273" y="522">B−</text><text x="364" y="456">OUT+</text><text x="364" y="522">OUT−</text></g>

<rect x="430" y="380" width="70" height="34" rx="6" fill="#ccc"/><rect x="440" y="386" width="26" height="22" rx="3" fill="#333"/>
<text x="465" y="372" text-anchor="middle" fill="#e8eefc" font-size="15" font-weight="700">ON/OFF</text>

<g fill="none" stroke-width="4">
 <path d="M230 470 H270" stroke="#ff5252"/>
 <path d="M230 520 H270" stroke="#888"/>
 <path d="M390 450 H415 V397 H430" stroke="#ff5252"/>
 <path d="M500 397 H530 V520 H560" stroke="#ff5252"/>
 <path d="M390 520 H405 V470 H560" stroke="#888"/>
 <!-- sonar VCC from 5V -->
 <path d="M530 520 V800 H955 V568 H965" stroke="#ff5252"/>
</g>
<text x="760" y="822" text-anchor="middle" fill="#ff8a80" font-size="15">battery + (after switch) → HC-SR04 VCC</text>

<!-- battery divider -->
<rect x="420" y="590" width="44" height="18" rx="6" fill="#d7c39a"/><rect x="420" y="660" width="44" height="18" rx="6" fill="#d7c39a"/>
<text x="400" y="604" text-anchor="end" fill="#ffd54f" font-size="14">10k</text><text x="400" y="674" text-anchor="end" fill="#ffd54f" font-size="14">10k</text>
<g fill="none" stroke-width="3">
 <path d="M530 560 H442 V590" stroke="#ff5252"/>
 <path d="M442 608 V660" stroke="#4fc3ff"/>
 <path d="M442 634 H520 V570 H560" stroke="#4fc3ff"/>
 <path d="M442 678 V700 H405 V520" stroke="#888"/>
</g>
<text x="300" y="720" fill="#4fc3ff" font-size="14">battery level sensor</text>

<!-- touch -->
<circle cx="300" cy="790" r="26" fill="#d4a017"/><text x="300" y="796" text-anchor="middle" fill="#3a2a00" font-size="13" font-weight="800">coin</text>
<path d="M560 620 H510 V760 H326" fill="none" stroke="#ff80ab" stroke-width="4"/>
<text x="230" y="845" fill="#ff80ab" font-size="15">touch pad on the lid (coin / foil)</text>

<!-- notes -->
<g font-size="16" fill="#dbe4f7">
 <text x="40" y="900">⚠️ Never connect the cells in SERIES to the TP4056 · charge both cells full before joining them</text>
 <text x="40" y="928">⚠️ OLED VCC goes to 3V3 · HC-SR04 ECHO goes through a 10k resistor (protects the ESP32)</text>
 <text x="40" y="956">✅ Unplug the battery switch while uploading code over USB-C</text>
</g>
</svg></body></html>
